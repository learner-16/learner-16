name: Validate LEARNER 16
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
      - name: Validate JSON
        run: |
          for file in data/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Check required app files
        run: |
          test -f index.html
          test -f sw.js
          test -f assets/icon-192.svg
          test -f assets/icon-512.svg
          test -f js/app.js
          test -f data/courses.json
